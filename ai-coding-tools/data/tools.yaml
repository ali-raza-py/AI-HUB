# =============================================================================
# tools.yaml - Master registry of AI coding tools & agents
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for tool data.
# Generated documentation, indexes, and comparison tables should be derived
# from this file (see scripts/).
#
# Field reference:
#   name                 - display name
#   id                   - stable slug (used for filenames: tools/<id>.md)
#   category             - one of the ids in data/categories.yaml
#   subcategory          - one of the ids in categories.yaml (subcategories)
#   company              - vendor / maintainer
#   official_website     - official site
#   official_docs        - official docs
#   github               - canonical source repo (if public)
#   status               - active | archived | discontinued | deprecated | renamed | acquired
#   official_status_notes- short verified note about status (esp. for archived tools)
#   last_verified        - YYYY-MM of last verification (all: 2026-09 unless noted)
#   open_source          - true | false | "source-available" | "unknown"
#   license              - SPDX id or "Unknown"
#   self_hosted          - can it be self-hosted/run entirely on own infra?
#   byok                 - bring-your-own-API-key support
#   local_models         - supports local model runners (Ollama, LM Studio, llama.cpp)
#   cloud_models         - uses hosted model providers
#   ide_support          - comma list (read from ide_* booleans below too)
#   vscode / jetbrains / zed / terminal / web / desktop
#   mcp                  - Model Context Protocol support
#   terminal_execution   - can execute shell commands
#   file_editing         - can edit files
#   repository_context   - can use the whole repo as context
#   git_support          - git operations
#   pull_requests        - can open PRs
#   testing              - can run tests
#   debugging            - debugging workflows
#   autonomy_level       - 0..5 (see docs/autonomy-scale) — never a marketing claim
#   free                 - exists at $0
#   free_tier            - free limited tier exists
#   pricing_summary      - one-line summary
#   best_for             - short, evidenced
#   strengths / weaknesses - short
#   student_friendliness - excellent | good | possible-but-limited | not-recommended
#   hardware_requirements- summary
#   cpu_only             - usable on CPU-only machine
#   ram_requirements     - summary
#   alternatives         - related tool ids
#
# Values marked `Unknown` have not been verified for 2026-09.
# Do not invent values. Always check the official source before editing.
# =============================================================================

