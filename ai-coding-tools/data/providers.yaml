- id: deepseek
  name: DeepSeek
  official_url: https://www.deepseek.com/
  api: true
  byok: true
  local: false
  notes: DeepSeek-V3/R1 line; open-weight releases + hosted API.
  last_verified: 2026-09
- id: moonshot-ai
  name: Moonshot AI
  official_url: https://www.moonshot.ai/
  api: true
  byok: true
  local: false
  notes: Kimi family (long-context models).
  last_verified: 2026-09
- id: zhipu-ai
  name: Zhipu (Z.ai)
  official_url: https://z.ai/
  api: true
  byok: true
